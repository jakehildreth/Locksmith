name: Build and Publish to PSGallery and GitHub

on:
  push:
    paths:
      - 'Public/**'
      - 'Private/**'
      - 'Build/**'
      - 'Locksmith.psm1'
      - 'Locksmith.psd1'
      - 'LICENSE'
      - '.github/workflows/publish.yml'

  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install required PowerShell modules
      shell: pwsh
      run: |
        Write-Host "Installing required modules..." -ForegroundColor Cyan
        Install-Module -Name Pester -AllowClobber -Scope CurrentUser -SkipPublisherCheck -Force
        Install-Module -Name PSScriptAnalyzer -AllowClobber -Scope CurrentUser -Force
        Install-Module -Name PSPublishModule -AllowClobber -MaximumVersion 2.0.27 -Scope CurrentUser -Force
        Write-Host "Modules installed successfully" -ForegroundColor Green

    # Locksmith requires the ActiveDirectory module at build time (analysis and self-import).
    - name: Install RSAT AD PowerShell
      shell: pwsh
      run: Install-WindowsFeature -Name RSAT-AD-PowerShell

    - name: Build and Publish Release to PowerShell Gallery
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        Write-Host "Building and publishing Locksmith release..." -ForegroundColor Cyan
        ./Build/Build-Module.ps1 -PublishToPSGallery -PSGalleryAPIKey $env:PSGALLERY_API_KEY
        Write-Host "Published release successfully" -ForegroundColor Green

    - name: Build and Publish Prerelease to PowerShell Gallery
      if: github.ref != 'refs/heads/main'
      shell: pwsh
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      run: |
        Write-Host "Building and publishing Locksmith prerelease..." -ForegroundColor Cyan
        ./Build/Build-Module.ps1 -PublishToPSGallery -PSGalleryAPIKey $env:PSGALLERY_API_KEY -Prerelease 'pre'
        Write-Host "Published prerelease successfully" -ForegroundColor Green

    - name: Get module version
      id: version
      shell: pwsh
      run: |
        $manifest = Import-PowerShellDataFile ./Locksmith.psd1
        $version = $manifest.ModuleVersion
        $prerelease = $manifest.PrivateData.PSData.Prerelease
        $fullVersion = if ($prerelease) { "$version-$prerelease" } else { $version }
        echo "version=$fullVersion" >> $env:GITHUB_OUTPUT
        Write-Host "Module version: $fullVersion" -ForegroundColor Green

    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseArguments = @(
            'release', 'create', '${{ steps.version.outputs.version }}'
            './Artefacts/Script/Invoke-Locksmith.ps1'
            './Artefacts/ScriptPacked/Invoke-Locksmith.zip'
            '--title', 'Locksmith ${{ steps.version.outputs.version }}'
            '--target', '${{ github.sha }}'
            '--generate-notes'
        )
        if ('${{ github.ref }}' -ne 'refs/heads/main') { $releaseArguments += '--prerelease' }
        gh @releaseArguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # main requires PRs, so the bot cannot push there. Commit the built script to the
    # feature branch instead; it reaches main when the PR merges.
    - name: Commit single-file script to branch
      if: github.ref != 'refs/heads/main'
      shell: pwsh
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        git diff --quiet -- Invoke-Locksmith.ps1
        if ($LASTEXITCODE -eq 0) {
            Write-Host "[i] Invoke-Locksmith.ps1 unchanged" -ForegroundColor Cyan
            exit 0
        }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add Invoke-Locksmith.ps1
        git commit -m 'chore(build): update Invoke-Locksmith.ps1 from prerelease build'
        git push origin "HEAD:refs/heads/$env:BRANCH_NAME"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
